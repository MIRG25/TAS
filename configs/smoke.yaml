base_config: default.yaml

experiment:
  name: smoke
  description: Minimal supervised development run

data:
  num_workers: 0
  random_crop:
    attempts: 8

validation:
  early_stopping_patience: 0
  min_epochs: 1

model:
  base_channels: 4
  feature_dim: 16
  adapter_dim: 4
  dropout: 0.0
  attention_hidden_channels: 4

training:
  epochs: 1
  output_dir: smoke_runs

evaluation:
  significance_permutations: 100
  significance_bootstrap_repetitions: 100
